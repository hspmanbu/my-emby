name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22          # 从 20 升级到 22（LTS），避免 Node 20 废弃警告
          # 不使用 cache，因为仓库目前没有 package-lock.json（只有 bun.lock）
          # 如果以后生成了 package-lock.json，可以改成 cache: 'npm'

      - name: Install dependencies
        run: npm install            # 改成 npm install（没有 lock 文件时 npm ci 会报警告）

      - name: Build Web App
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap copy android
          npx cap update android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yamby-Emby-Client-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk